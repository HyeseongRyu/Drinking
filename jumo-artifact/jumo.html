<title>주모</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.js"></script>
<style>
  :root {
    --bg: #f2eef1;
    --surface: #ffffff;
    --surface-2: #eae2e8;
    --ink: #201a24;
    --muted: #786f7f;
    --line: #e2d9df;
    --wine: #93314c;
    --wine-solid: #93314c;
    --gold: #b3872f;
    --danger: #a8382a;
    --danger-solid: #a8382a;
    --heart: #c23d5c;
    --on-solid: #ffffff;
    --shadow: 0 2px 14px rgba(32, 22, 30, 0.08);
    --shadow-lg: 0 22px 60px rgba(32, 22, 30, 0.16);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17131a;
      --surface: #221d27;
      --surface-2: #2b2530;
      --ink: #f1ecee;
      --muted: #a89aa8;
      --line: #372e3d;
      --wine: #e28ba0;
      --wine-solid: #a8415d;
      --gold: #d9a94f;
      --danger: #e2a89c;
      --danger-solid: #b1493a;
      --heart: #ea94a8;
      --shadow: 0 2px 14px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 22px 60px rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #17131a;
    --surface: #221d27;
    --surface-2: #2b2530;
    --ink: #f1ecee;
    --muted: #a89aa8;
    --line: #372e3d;
    --wine: #e28ba0;
    --wine-solid: #a8415d;
    --gold: #d9a94f;
    --danger: #e2a89c;
    --danger-solid: #b1493a;
    --heart: #ea94a8;
    --shadow: 0 2px 14px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 22px 60px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-tap-highlight-color: transparent;
  }

  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  :focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  .app-shell {
    max-width: 720px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  @media (min-width: 760px) {
    .app-shell { box-shadow: var(--shadow-lg); }
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: max(14px, env(safe-area-inset-top)) 18px 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  .app-header h1 {
    margin: 0;
    flex: 1;
    text-align: center;
    font-family: 'Gowun Batang', serif;
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: 0.01em;
  }
  .icon-btn, .icon-spacer {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
  }
  .icon-btn {
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn svg { width: 18px; height: 18px; }
  .icon-btn.accent { background: var(--wine-solid); color: var(--on-solid); }

  .app-main { flex: 1; padding: 18px 18px 100px; }

  /* filter bar */
  .filter-bar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
  .filter-rail { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .filter-rail::-webkit-scrollbar { display: none; }

  .chip {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-size: 0.86rem;
    white-space: nowrap;
  }
  .chip svg { width: 15px; height: 15px; flex-shrink: 0; }
  .chip.active { background: var(--wine-solid); border-color: var(--wine-solid); color: var(--on-solid); }

  .fav-toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    align-self: flex-start;
    font-size: 0.88rem;
    color: var(--muted);
  }
  .fav-toggle svg { width: 15px; height: 15px; color: var(--heart); }
  .fav-toggle input { accent-color: var(--heart); width: 16px; height: 16px; }

  .toggle-row { display: flex; gap: 18px; flex-wrap: wrap; }
  .owner-row { font-size: 0.8rem; color: var(--muted); }
  .owner-row button { color: var(--wine); text-decoration: underline; padding: 0; font-size: inherit; }

  .owner-badge {
    position: absolute; top: 8px; left: 8px; padding: 3px 9px; border-radius: 999px;
    background: rgba(20, 14, 18, 0.55); color: #fff; font-size: 0.68rem; font-weight: 600;
  }
  .detail-owner-badge {
    align-self: flex-start; padding: 5px 12px; border-radius: 999px;
    background: var(--surface-2); color: var(--muted); font-size: 0.78rem;
  }

  /* grid + card */
  .drink-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: 14px; }

  .drink-card {
    background: var(--surface);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: var(--shadow);
    text-align: left;
    display: flex;
    flex-direction: column;
    width: 100%;
    transition: transform 0.12s ease;
  }
  .drink-card:active { transform: scale(0.98); }

  .drink-card-media, .detail-media {
    position: relative;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    overflow: hidden;
  }
  .drink-card-media { aspect-ratio: 1 / 1; }
  .drink-card-media img, .detail-media img { width: 100%; height: 100%; object-fit: cover; }
  .drink-card-icon svg { width: 46px; height: 46px; }

  .favorite-chip {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(20, 14, 18, 0.45);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .favorite-chip svg { width: 16px; height: 16px; }
  .favorite-chip.active { background: rgba(255, 255, 255, 0.92); color: var(--heart); }
  .favorite-chip.large { width: 44px; height: 44px; }
  .favorite-chip.large svg { width: 20px; height: 20px; }

  .drink-card-body { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 5px; }
  .drink-card-cat, .detail-cat {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 0.74rem; color: var(--muted);
  }
  .drink-card-cat svg, .detail-cat svg { width: 13px; height: 13px; }
  .drink-card-name {
    margin: 0; font-family: 'Gowun Batang', serif; font-weight: 700;
    font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .drink-card-score { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .score-num { font-weight: 600; font-size: 0.86rem; color: var(--muted); flex-shrink: 0; }

  .score-gauge {
    position: relative; flex: 1; height: 6px; border-radius: 999px;
    background: var(--surface-2); overflow: hidden;
  }
  .score-gauge-sm { height: 5px; }
  .score-gauge-lg { height: 10px; }
  .score-gauge-fill { position: absolute; inset: 0; background: var(--wine); border-radius: inherit; }
  .overall-block .score-gauge-fill { background: linear-gradient(90deg, var(--wine), var(--gold)); }

  .empty-state { text-align: center; padding: 70px 20px; color: var(--muted); }
  .empty-mark svg { width: 44px; height: 44px; margin-bottom: 10px; opacity: 0.7; }
  .empty-state p { margin: 4px 0; }

  .status-screen { text-align: center; padding: 90px 24px; color: var(--muted); }
  .status-sub { font-size: 0.85rem; margin-top: 6px; }

  .setup-screen {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 14px; padding: 40px 8px 20px;
  }
  .setup-screen h2 { margin: 0; font-family: 'Gowun Batang', serif; font-size: 1.3rem; }
  .setup-desc { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.6; max-width: 340px; }
  .setup-screen input[type="text"] {
    width: 100%; max-width: 280px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 13px 15px; font-size: 1rem; text-align: center;
  }
  .setup-screen input[type="text"]:focus { outline: 2px solid var(--wine); outline-offset: -1px; }
  .setup-screen .form-actions { max-width: 280px; width: 100%; margin-top: 4px; }

  .fab {
    position: fixed;
    bottom: max(24px, env(safe-area-inset-bottom));
    right: max(24px, calc((100vw - 720px) / 2 + 24px));
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--wine-solid); color: var(--on-solid);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-lg); z-index: 15;
  }
  .fab svg { width: 24px; height: 24px; }
  @media (max-width: 760px) { .fab { right: 24px; } }

  /* form */
  .drink-form { display: flex; flex-direction: column; gap: 20px; }

  .photo-picker {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 18px;
    border: 2px dashed var(--line);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .photo-picker img { width: 100%; height: 100%; object-fit: cover; }
  .photo-placeholder { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted); }
  .photo-placeholder svg { width: 30px; height: 30px; }
  .photo-loading { color: var(--muted); font-size: 0.92rem; }
  .photo-remove {
    position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%;
    background: rgba(20, 14, 18, 0.55); color: #fff; display: flex; align-items: center; justify-content: center;
  }
  .photo-remove svg { width: 16px; height: 16px; }

  .photo-actions { display: flex; gap: 10px; }
  .photo-actions .btn { display: flex; align-items: center; justify-content: center; gap: 7px; }
  .photo-actions .btn svg { width: 16px; height: 16px; }

  .ai-panel {
    background: var(--surface); border: 1px dashed var(--line); border-radius: 14px;
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .ai-panel:empty { display: none; }
  .ai-trigger { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .ai-trigger svg { width: 16px; height: 16px; color: var(--gold); }
  .ai-status { margin: 0; color: var(--muted); font-size: 0.9rem; display: flex; align-items: center; gap: 7px; }
  .ai-status svg { width: 15px; height: 15px; color: var(--gold); flex-shrink: 0; }
  .ai-status.ai-error { color: var(--danger); }
  .ai-result { display: flex; flex-direction: column; gap: 10px; }
  .ai-name-suggestion {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding-bottom: 10px; border-bottom: 1px solid var(--line);
  }
  .ai-name-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; flex-shrink: 0; }
  .ai-name-value { font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 1.05rem; flex: 1; min-width: 0; }
  .ai-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px 14px; margin: 0; }
  .ai-fields > div { display: flex; flex-direction: column; gap: 2px; }
  .ai-fields dt { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 0; }
  .ai-fields dd { margin: 0; font-size: 0.92rem; }
  .ai-history { margin: 0; font-size: 0.88rem; line-height: 1.5; }
  .ai-note { margin: 0; font-size: 0.82rem; color: var(--muted); }
  .ai-disclaimer { margin: 0; font-size: 0.76rem; color: var(--muted); }
  .ai-actions { display: flex; gap: 8px; align-items: center; }
  .btn-sm { flex: none; padding: 9px 14px; font-size: 0.85rem; }
  .ai-applied { font-size: 0.85rem; color: var(--muted); }


  .cand-block { display: flex; flex-direction: column; gap: 9px; padding-bottom: 11px; border-bottom: 1px solid var(--line); }
  .cand-block .ai-name-label em { font-style: normal; text-transform: none; letter-spacing: 0; opacity: 0.85; margin-left: 6px; }
  .cand-chips { display: flex; flex-direction: column; gap: 7px; }
  .cand-chip {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 1rem; line-height: 1.35;
  }
  .cand-chip.active { background: var(--wine-solid); border-color: var(--wine-solid); color: var(--on-solid); }
  .cand-top {
    flex-shrink: 0; font-family: 'IBM Plex Sans KR', sans-serif; font-weight: 600;
    font-size: 0.7rem; padding: 3px 8px; border-radius: 999px;
    background: var(--surface); color: var(--muted);
  }
  .cand-chip.active .cand-top { background: rgba(255, 255, 255, 0.22); color: var(--on-solid); }

  .field { display: flex; flex-direction: column; gap: 9px; }
  .field-label { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.84rem; font-weight: 600; color: var(--muted); }
  .field-label em { font-style: normal; font-weight: 400; opacity: 0.8; }
  .desc-loading {
    display: inline-flex; align-items: center; gap: 5px;
    color: var(--wine); font-weight: 600; font-size: 0.78rem;
    background: var(--surface-2); padding: 3px 9px; border-radius: 999px;
  }
  .desc-loading svg { width: 12px; height: 12px; animation: spin 1.1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .field textarea:disabled { opacity: 0.6; }

  .field input[type="text"], .field textarea {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 15px; font-size: 1rem; resize: vertical;
  }
  .field input[type="text"]:focus, .field textarea:focus { outline: 2px solid var(--wine); outline-offset: -1px; }

  .category-rail { display: flex; flex-wrap: wrap; gap: 8px; }

  .rating-panel {
    display: flex; flex-direction: column; gap: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px;
  }
  .rating-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .rating-row-label { font-size: 0.92rem; color: var(--muted); min-width: 64px; }
  .segmented { display: flex; gap: 6px; }
  .segment {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--surface-2); color: var(--muted);
    font-weight: 600; font-size: 0.95rem;
    display: flex; align-items: center; justify-content: center;
  }
  .segment.active { background: var(--wine-solid); color: var(--on-solid); }

  .overall-preview {
    margin-top: 10px; display: flex; align-items: baseline; gap: 6px;
    font-size: 0.92rem; color: var(--muted);
  }
  .overall-preview strong { font-family: 'Gowun Batang', serif; font-size: 1.3rem; color: var(--wine); }
  .overall-preview .of5 { font-size: 0.82rem; }

  .form-error { color: var(--danger); font-size: 0.9rem; margin: 0; }

  .form-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { flex: 1; min-width: 90px; padding: 14px 16px; border-radius: 13px; font-size: 0.97rem; font-weight: 600; }
  .btn-primary { background: var(--wine-solid); color: var(--on-solid); }
  .btn-primary:disabled { opacity: 0.45; }
  .btn-secondary { background: var(--surface-2); color: var(--ink); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn-danger { background: var(--danger-solid); color: var(--on-solid); }
  .btn-danger-outline { background: transparent; color: var(--danger); border: 1px solid var(--danger); }

  /* detail */
  .detail-media { aspect-ratio: 4 / 3; border-radius: 18px; }
  .detail-icon svg { width: 68px; height: 68px; }
  .detail-body { padding-top: 18px; display: flex; flex-direction: column; gap: 11px; }
  .detail-name { margin: 0; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 1.5rem; text-wrap: balance; }
  .detail-date { margin: 0; color: var(--muted); font-size: 0.85rem; }

  .overall-block {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin: 4px 0;
  }
  .overall-num { font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 1.7rem; color: var(--wine); flex-shrink: 0; }

  .criteria-panel {
    display: flex; flex-direction: column; gap: 12px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  }
  .criteria-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .criteria-row > span:first-child { color: var(--muted); font-size: 0.92rem; flex-shrink: 0; min-width: 60px; }
  .criteria-value { display: flex; align-items: center; gap: 10px; flex: 1; max-width: 200px; }

  .memo-block {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .memo-block p { margin: 0; white-space: pre-wrap; line-height: 1.6; }

  .photo-meta { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); margin-top: -6px; }
  .photo-meta svg { width: 14px; height: 14px; color: var(--wine); flex-shrink: 0; }

  /* tabs */
  .main-tabs { display: flex; gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 13px; margin-bottom: 16px; }
  .tab-btn { flex: 1; padding: 10px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; color: var(--muted); }
  .tab-btn.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  /* map */
  .map-plot {
    position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; margin-bottom: 16px;
    background-color: var(--surface);
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 12.5% 12.5%;
    border: 1px solid var(--line);
  }
  .map-pin {
    position: absolute; transform: translate(-50%, -50%);
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--wine-solid); color: var(--on-solid);
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow); border: 3px solid var(--surface);
  }
  .map-pin svg { width: 17px; height: 17px; }
  .map-list { display: flex; flex-direction: column; gap: 10px; }
  .map-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; text-align: left; width: 100%; }
  .map-row-icon svg { width: 22px; height: 22px; color: var(--muted); }
  .map-row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .map-row-body strong { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .map-row-body span { font-size: 0.78rem; color: var(--muted); }
  .map-row-link {
    flex-shrink: 0; font-size: 0.8rem; font-weight: 600; color: var(--wine);
    padding: 7px 11px; border: 1px solid var(--wine); border-radius: 9px;
  }

  .location-block {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .location-block p { margin: 0; font-size: 0.92rem; color: var(--ink); }
  .location-link {
    align-self: flex-start; font-size: 0.85rem; font-weight: 600; color: var(--on-solid);
    background: var(--wine-solid); padding: 9px 16px; border-radius: 10px; display: inline-flex; align-items: center; gap: 6px;
  }
  .location-link svg { width: 15px; height: 15px; }
</style>

<div id="app">
  <header class="app-header">
    <span class="icon-spacer"></span>
    <h1>주모</h1>
    <span class="icon-spacer"></span>
  </header>
  <main class="app-main">
    <div class="status-screen"><p>불러오는 중...</p></div>
  </main>
</div>

<script>
(function () {
  var ICONS = {

  function friendlyDbError(err) {

  function loadImageFromFile(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { resolve(img); URL.revokeObjectURL(url); };
      img.onerror = function (e) { URL.revokeObjectURL(url); reject(e); };
      img.src = url;
    });
  }

  function extractExif(file) {
    // EXIF.getData의 콜백이 특정 사진(HEIC 등)에서 아예 호출되지 않는 경우가 있어,
    // 타임아웃으로 상한을 둬서 뒤따르는 AI 분석 자동 실행이 무한정 막히지 않게 한다.
    var settled = false;
    var timed = new Promise(function (resolve) {
      setTimeout(function () { if (!settled) resolve({}); }, 3000);
    });
    var real = new Promise(function (resolve) {
      function done(v) { settled = true; resolve(v); }
      if (typeof EXIF === 'undefined') { done({}); return; }
      try {
        EXIF.getData(file, function () {
          try {
            var lat = EXIF.getTag(this, 'GPSLatitude');
            var latRef = EXIF.getTag(this, 'GPSLatitudeRef');
            var lon = EXIF.getTag(this, 'GPSLongitude');
            var lonRef = EXIF.getTag(this, 'GPSLongitudeRef');
            var dateStr = EXIF.getTag(this, 'DateTimeOriginal') || EXIF.getTag(this, 'DateTime');
            var location = null;
            if (lat && lon && lat.length === 3 && lon.length === 3) {
              var latDec = Number(lat[0]) + Number(lat[1]) / 60 + Number(lat[2]) / 3600;
              var lonDec = Number(lon[0]) + Number(lon[1]) / 60 + Number(lon[2]) / 3600;
              if (latRef === 'S') latDec = -latDec;
              if (lonRef === 'W') lonDec = -lonDec;
              if (isFinite(latDec) && isFinite(lonDec)) {
                location = { lat: Math.round(latDec * 1e6) / 1e6, lon: Math.round(lonDec * 1e6) / 1e6 };
              }
            }
            var takenAt = null;
            if (dateStr) {
              var m = /^(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/.exec(dateStr);
              if (m) takenAt = m[1] + '-' + m[2] + '-' + m[3] + 'T' + m[4] + ':' + m[5] + ':' + m[6];
            }
            done({ location: location, takenAt: takenAt });
          } catch (e) { done({}); }
        });
      } catch (e) { done({}); }
    });
    return Promise.race([real, timed]);
  }

  function drawResized(img, maxDim, quality) {
    var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
    var w = Math.max(1, Math.round(img.width * scale));
    var h = Math.max(1, Math.round(img.height * scale));
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    return canvas.toDataURL('image/jpeg', quality);
  }

  function compressWithBudget(img, opts) {
    var dim = opts.startDim, quality = opts.startQuality;
    var out = drawResized(img, dim, quality);
    var guard = 0;
    while (out.length > opts.budgetChars && guard < 12) {
      if (quality > opts.minQuality) quality = Math.max(opts.minQuality, quality - 0.1);
      else dim = Math.max(opts.minDim, Math.round(dim * 0.85));
      out = drawResized(img, dim, quality);
      guard++;
    }
    return out;
  }

  async function preparePhoto(file) {

    return { photo: photo, thumb: thumb };
  }

  function mapViewHtml() {
    var withLoc = ownedDrinks().filter(function (d) { return d.location && typeof d.location.lat === 'number' && typeof d.location.lon === 'number'; });
    if (withLoc.length === 0) {
      return '<div class="empty-state"><div class="empty-mark">' + ICONS.pin + '</div><p>위치 정보가 있는 기록이 없어요.</p><p>사진에 위치 정보가 있으면 자동으로 표시돼요.</p></div>';
    }
    var lats = withLoc.map(function (d) { return d.location.lat; });
    var lons = withLoc.map(function (d) { return d.location.lon; });
    var minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
    var minLon = Math.min.apply(null, lons), maxLon = Math.max.apply(null, lons);
    var latSpan = (maxLat - minLat) || 0.001;
    var lonSpan = (maxLon - minLon) || 0.001;
    var pad = 14;
    var pins = withLoc.map(function (d) {
      var xPct = pad + ((d.location.lon - minLon) / lonSpan) * (100 - 2 * pad);
      var yPct = pad + (1 - (d.location.lat - minLat) / latSpan) * (100 - 2 * pad);
      var cfg = CATEGORIES[d.category];
      return '<button type="button" class="map-pin" style="left:' + xPct.toFixed(2) + '%; top:' + yPct.toFixed(2) + '%;" data-action="open-detail" data-id="' + d.id + '" aria-label="' + escapeHtml(d.name) + '">' + cfg.icon + '</button>';
    }).join('');
    var rows = withLoc.slice().sort(function (a, b) {
      return (b.takenAt || b.createdAt).localeCompare(a.takenAt || a.createdAt);
    }).map(function (d) {
      var cfg = CATEGORIES[d.category];
      return '<div class="map-row" data-action="open-detail" data-id="' + d.id + '" role="button" tabindex="0">' +
        '<span class="map-row-icon">' + cfg.icon + '</span>' +
        '<div class="map-row-body"><strong>' + escapeHtml(d.name) + '</strong>' +
        '<span>' + formatCoord(d.location) + (d.takenAt ? ' · ' + formatTakenAtShort(d.takenAt) : '') + '</span></div>' +
        '<a class="map-row-link" href="' + mapsUrl(d.location) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">구글맵</a>' +
        '</div>';
    }).join('');
    return '<div class="map-plot">' + pins + '</div><div class="map-list">' + rows + '</div>';
  }

  function listViewHtml() {
    var mine = ownedDrinks();
    var drinks = mine;
    if (state.filterCategory !== 'all') drinks = drinks.filter(function (d) { return d.category === state.filterCategory; });
    if (state.favoritesOnly) drinks = drinks.filter(function (d) { return d.favorite; });
    var body = drinks.length === 0 ? emptyStateHtml(mine.length === 0) : '<div class="drink-grid">' + drinks.map(drinkCardHtml).join('') + '</div>';
    return mainTabsHtml() +
      (state.mainTab === 'map' ? mapViewHtml() : (filterBarHtml() + body)) +
      '<button type="button" class="fab" data-action="open-add-form" aria-label="새 기록">' + ICONS.plus + '</button>';
  }

  function photoAnalysisReady(draft) {
    return state.sampleImagesAvailable && !!draft.photo;
  }

  function retryAction(draft) {
    return photoAnalysisReady(draft) ? 'analyze-photo' : 'analyze-name';
  }

  function aiPanelInner(draft) {
    if (!state.sampleChecked) {
      return '<p class="ai-status">' + ICONS.sparkle + ' AI 기능 확인 중...</p>';
    }
    if (!state.sampleTextAvailable) {
      if (!draft.photo) return '';
      return '<p class="ai-status">이 화면에서는 AI 자동 채우기를 쓸 수 없어요.</p>' +
        '<p class="ai-status" style="font-size:0.78rem;">이름 · 설명은 직접 입력해주세요.</p>';
    }
    if (draft.aiLoading) {
      var what = draft.aiSource === 'photo'
        ? '사진으로 이름과 정보를 찾고 있어요...'
        : '‘' + escapeHtml((draft.name || '').trim()) + '’ 정보를 찾고 있어요...';
      return '<p class="ai-status">' + ICONS.sparkle + ' ' + what + '</p>';
    }
    if (draft.aiError) {
      return '<p class="ai-status ai-error">' + escapeHtml(draft.aiError) + '</p>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="' + retryAction(draft) + '">다시 시도</button>';
    }
    if (draft.aiResult) {
      var r = draft.aiResult;
      var fields = '';
      if (r.type) fields += '<div><dt>종류</dt><dd>' + escapeHtml(r.type) + '</dd></div>';
      if (r.abv) fields += '<div><dt>도수</dt><dd>' + escapeHtml(r.abv) + '</dd></div>';
      if (r.origin) fields += '<div><dt>원산지</dt><dd>' + escapeHtml(r.origin) + '</dd></div>';
      if (r.priceRange) fields += '<div><dt>가격대</dt><dd>' + escapeHtml(r.priceRange) + '</dd></div>';
      var cands = draft.candidates || [];
      var current = (draft.name || '').trim();
      var nameRow = '';
      if (cands.length) {
        nameRow = '<div class="cand-block">' +
          '<span class="ai-name-label">이름 후보 <em>맞는 걸 눌러주세요</em></span>' +
          '<div class="cand-chips">' +
          cands.map(function (c, i) {
            return '<button type="button" class="cand-chip ' + (current === c ? 'active' : '') + '" data-action="apply-candidate" data-name="' + escapeHtml(c) + '">' +
              escapeHtml(c) + (i === 0 && current !== c ? '<span class="cand-top">유력</span>' : '') +
              (current === c ? '<span class="cand-top">선택됨</span>' : '') +
              '</button>';
          }).join('') +
          '</div>' +
          '<p class="ai-note">맞는 게 없으면 아래 ‘술 이름’에 직접 적어주세요.</p>' +
          '</div>';
      } else {
        nameRow = '<p class="ai-status">이름 후보를 찾지 못했어요. 아래 ‘술 이름’에 직접 적어주세요.</p>';
      }
      var gotAnything = fields || r.history;
      return '<div class="ai-result">' +
        nameRow +
        (fields ? '<dl class="ai-fields">' + fields + '</dl>' : '') +
        (r.history ? '<p class="ai-history">' + escapeHtml(r.history) + '</p>' : '') +
        (r.note ? '<p class="ai-note">' + escapeHtml(r.note) + '</p>' : '') +
        (gotAnything
          ? '<p class="ai-disclaimer">AI가 추정한 정보라 실제와 다를 수 있어요. 아래 설명 란에 자동으로 채워드렸어요.</p>'
          : '<p class="ai-status">이 이름으로는 아는 정보가 없어요. 설명은 직접 적어주세요.</p>') +
        '<div class="ai-actions">' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="' + retryAction(draft) + '">다시 찾기</button>' +
        '</div></div>';
    }
    if (photoAnalysisReady(draft)) {
      return '<button type="button" class="btn btn-ghost btn-sm ai-trigger" data-action="analyze-photo">' + ICONS.sparkle + ' 사진으로 이름 · 정보 추천받기</button>';
    }
    if ((draft.name || '').trim().length >= 2) {
      return '<button type="button" class="btn btn-ghost btn-sm ai-trigger" data-action="analyze-name">' + ICONS.sparkle + ' 이 이름으로 정보 찾기</button>';
    }
    return '<p class="ai-status">' + ICONS.sparkle + ' 술 이름을 적으면 이름 후보와 정보를 찾아드려요.</p>';
  }

  function aiPanelHtml(draft) {
    return '<div class="ai-panel" id="ai-panel">' + aiPanelInner(draft) + '</div>';
  }

  function categoryChipsHtml(draft) {
    return Object.keys(CATEGORIES).map(function (key) {
      var c = CATEGORIES[key];
      return '<button type="button" class="chip ' + (draft.category === key ? 'active' : '') + '" data-action="pick-category" data-category="' + key + '">' + c.icon + escapeHtml(c.label) + '</button>';
    }).join('');
  }

  // 이름을 타이핑하는 중에 전체 render()를 돌리면 입력 포커스와 커서가 날아가므로,
  // AI 관련 조각만 제자리에서 갈아끼운다.
  function syncAiUi() {
    var draft = state.formDraft;
    if (!draft) return;
    var panel = document.getElementById('ai-panel');
    if (panel) panel.innerHTML = aiPanelInner(draft);
    var badge = document.getElementById('desc-loading-slot');
    if (badge) {
      badge.innerHTML = draft.aiLoading
        ? '<span class="desc-loading">' + ICONS.sparkle + ' 분석 중...</span>'
        : '';
    }
    var ta = document.querySelector('textarea[data-field="description"]');
    if (ta && document.activeElement !== ta && ta.value !== draft.description) {
      ta.value = draft.description;
    }
  }

  // 분석 결과가 들어오면 종류 칩과 평가 항목까지 바뀔 수 있어 전체를 다시 그려야 한다.
  // 그 사이 사용자가 이름을 치고 있었다면 커서 위치까지 돌려놓는다.
  function renderPreservingFocus() {
    var el = document.activeElement;
    var field = el && el.dataset ? el.dataset.field : null;
    var start = null, end = null;
    if (field) { try { start = el.selectionStart; end = el.selectionEnd; } catch (e) {} }
    render();
    if (!field) return;
    var next = document.querySelector('[data-field="' + field + '"]');
    if (!next) return;
    next.focus();
    if (start !== null) { try { next.setSelectionRange(start, end); } catch (e) {} }
  }

  function normalizeAiResult(r) {
    if (!r || typeof r !== 'object') return null;
    var list = Array.isArray(r.candidates) ? r.candidates : (r.name ? [r.name] : []);
    var candidates = [];
    list.forEach(function (c) {
      var name = typeof c === 'string' ? c.trim() : '';
      if (name && candidates.indexOf(name) === -1 && candidates.length < 4) candidates.push(name);
    });
    return {
      candidates: candidates,
      type: r.type || null,
      abv: r.abv || null,
      origin: r.origin || null,
      priceRange: r.priceRange || null,
      history: r.history || null,
      note: r.note || null
    };
  }

  function composeDescription(r) {
    var lines = [];
    if (r.type) lines.push('종류: ' + r.type);
    if (r.abv) lines.push('도수: ' + r.abv);
    if (r.origin) lines.push('원산지: ' + r.origin);
    if (r.priceRange) lines.push('가격대: ' + r.priceRange);
    if (r.history) lines.push(r.history);
    if (r.note) lines.push('(' + r.note + ')');
    return lines.join('\n');
  }

  function friendlySampleError(err) {
    if (!err) return '분석에 실패했어요.';
    switch (err.code) {
      case 'not_granted': return 'AI 분석 권한이 없어요.';
      case 'images_unavailable': return '이 화면에서는 사진 분석을 쓸 수 없어요.';
      case 'image_rejected': return '이 사진은 분석할 수 없어요. 다른 사진으로 시도해주세요.';
      case 'rate_limited': return '요청이 많아요. 잠시 후 다시 시도해주세요.';
      case 'session_expired': return '다시 로그인한 후 시도해주세요.';
      case 'refused': return 'AI가 이 사진을 분석하지 않았어요.';
      case 'empty_completion': return '분석 결과를 받지 못했어요. 다시 시도해주세요.';
      case 'invalid_json': return '분석 결과 형식이 올바르지 않아요. 다시 시도해주세요.';
      case 'cancelled': return '분석을 취소했어요.';
      default: return '분석 중 문제가 발생했어요. 잠시 후 다시 시도해주세요.';
    }
  }

  async function getAnalysisBlob(draft) {
    if (draft.photoFile) return draft.photoFile;
    if (draft.photo) {
      try { var res = await fetch(draft.photo); return await res.blob(); } catch (e) { return null; }
    }
    return null;
  }

  var TYPE_TO_CATEGORY = [
    [/막걸리|탁주|동동주/, 'makgeolli'],
    [/위스키|위스기|whisky|whiskey|버번|브랜디|꼬냑|코냑/i, 'whiskey'],
    [/소주|증류식|고량주|보드카|진|럼|데킬라|테킬라/i, 'soju'],
    [/와인|샴페인|스파클링|포트|셰리|wine/i, 'wine'],
    [/맥주|라거|에일|ipa|스타우트|필스너|바이젠|beer/i, 'beer']
  ];

  function categoryFromType(type) {
    if (!type) return null;
    for (var i = 0; i < TYPE_TO_CATEGORY.length; i++) {
      if (TYPE_TO_CATEGORY[i][0].test(type)) return TYPE_TO_CATEGORY[i][1];
    }
    return null;
  }

  function buildAnalysisPrompt(draft, opts) {
    var cfg = CATEGORIES[draft.category];
    var body = '';
    if (opts.name) body += '술 이름(사용자 입력): ' + opts.name + '\n';
    // 고른 적 없는 기본값을 알려주면 오히려 엉뚱한 쪽으로 추정한다.
    if (draft.categoryPicked && cfg) body += '사용자가 고른 분류: ' + cfg.label;
    return ANALYSIS_RULES + body;
  }

  // 사진 · 라벨 텍스트 · 이름, 세 가지 입력 모두 같은 결과 형태로 모은다.
  async function runAnalysis(opts) {
    var draft = state.formDraft;
    if (!draft || !sample) return;
    draft.aiSource = opts.source;
    draft.aiLoading = true;
    draft.aiError = null;
    if (opts.name) draft.lastAnalyzedName = opts.name;
    syncAiUi();
    try {
      var callOpts = { modelTier: 'quick' };
      if (opts.images) callOpts.images = opts.images;
      var raw = await sample.json(buildAnalysisPrompt(draft, opts), callOpts);
      applyAiResult(draft, normalizeAiResult(raw), opts);
    } catch (err) {
      if (err && err.code === 'not_granted') {
        if (opts.images) state.sampleImagesAvailable = false;
        else state.sampleTextAvailable = false;
      } else {
        draft.aiError = friendlySampleError(err);
      }
      if (opts.name) draft.lastAnalyzedName = null;
    } finally {
      draft.aiLoading = false;
      renderPreservingFocus();
    }
  }

  async function analyzePhoto() {
    var draft = state.formDraft;
    var blob = await getAnalysisBlob(draft);
    if (!blob) { draft.aiError = '분석할 사진이 없어요.'; syncAiUi(); return; }
    await runAnalysis({ source: 'photo', images: blob });
  }

  async function analyzeName(opts) {
    var draft = state.formDraft;
    var name = (draft.name || '').trim();
    if (name.length < 2) { draft.aiError = '술 이름을 두 글자 이상 적어주세요.'; syncAiUi(); return; }
    await runAnalysis({ source: 'name', name: name, keepCandidates: opts && opts.keepCandidates });
  }

  function applyAiResult(draft, result, opts) {
    draft.aiResult = result;
    if (!result) { draft.aiError = '분석 결과를 이해하지 못했어요.'; return; }
    if (!(opts && opts.keepCandidates)) draft.candidates = result.candidates;
    draft.infoForName = (opts && opts.name) || result.candidates[0] || null;
    // 사용자가 아직 종류를 고르지 않았으면 추정한 종류로 맞춰준다. 이미 매긴 점수는 건드리지 않는다.
    if (!draft.categoryPicked && !Object.keys(draft.ratings).length) {
      var cat = categoryFromType(result.type);
      if (cat && cat !== draft.category) draft.category = cat;
    }
    var desc = composeDescription(result);
    // 사용자가 직접 쓴 설명은 덮어쓰지 않는다.
    if (desc && (!draft.description || draft.descriptionFromAi)) {
      draft.description = desc;
      draft.descriptionFromAi = true;
    }
  }

  function applyCandidate(name) {
    var draft = state.formDraft;
    if (!draft || !name) return;
    draft.name = name;
    draft.lastAnalyzedName = name;
    render();
    // 후보를 바꿔 고르면 그 제품 기준으로 정보를 다시 받아온다. 후보 목록은 그대로 둔다.
    if (name !== draft.infoForName) analyzeName({ keepCandidates: true });
  }

  function scheduleNameAnalysis() {
    if (!state.formDraft) return;
    clearTimeout(nameAnalysisTimer);
    nameAnalysisTimer = setTimeout(async function () {
      // capability 확인이 아직 안 끝났을 수 있으므로 여기서 기다린 뒤 판단한다.
      if (sampleReady) await sampleReady;
      var d = state.formDraft;
      if (!d || d.aiLoading) return;
      if (!state.sampleTextAvailable || !sample) { syncAiUi(); return; }
      if (photoAnalysisReady(d)) { syncAiUi(); return; }
      if (d.description && !d.descriptionFromAi) { syncAiUi(); return; }
      var name = (d.name || '').trim();
      if (name.length < 2 || name === d.lastAnalyzedName) { syncAiUi(); return; }
      analyzeName();
    }, 1400);
  }


  function formViewHtml() {
    var draft = state.formDraft;
    var cfg = CATEGORIES[draft.category];
    var allRated = cfg.criteria.every(function (c) { return draft.ratings[c.key] >= 1; });
    var overall = allRated ? (cfg.criteria.reduce(function (s, c) { return s + draft.ratings[c.key]; }, 0) / cfg.criteria.length) : null;
    var canSubmit = draft.name.trim().length > 0 && allRated && !state.submitting && !draft.compressing;

    var photoInner;
    if (draft.compressing) photoInner = '<div class="photo-loading">사진 처리 중...</div>';
    else if (draft.photo) photoInner = '<img src="' + draft.photo + '" alt="미리보기">' + '<button type="button" class="photo-remove" data-action="remove-photo" aria-label="사진 삭제">' + ICONS.trash + '</button>';
    else photoInner = '<div class="photo-placeholder">' + ICONS.image + '<span>사진 추가</span></div>';

    var ratingRows = cfg.criteria.map(function (c) { return ratingRow(c, draft.ratings[c.key] || 0); }).join('');

    return '<form id="drink-form" class="drink-form">' +
      '<div class="photo-picker" data-action="trigger-library-input">' + photoInner + '</div>' +
      '<div class="photo-actions">' +
      '<button type="button" class="btn btn-ghost" data-action="trigger-library-input">' + ICONS.image + ' 앨범에서 선택</button>' +
      '<button type="button" class="btn btn-ghost" data-action="trigger-camera-input">' + ICONS.camera + ' 촬영</button>' +
      '</div>' +
      '<input type="file" id="library-file-input" accept="image/*" hidden>' +
      '<input type="file" id="camera-file-input" accept="image/*" capture="environment" hidden>' +
      (draft.location || draft.takenAt
        ? '<p class="photo-meta">' + ICONS.pin + (draft.location ? '위치 · ' : '') + (draft.takenAt ? formatTakenAtShort(draft.takenAt) + ' 촬영' : '사진에서 위치 정보를 찾았어요') + '</p>'
        : '') +
      '<label class="field"><span class="field-label">술 이름</span>' +
      '<input type="text" data-field="name" value="' + escapeHtml(draft.name) + '" placeholder="예: 곰표 밀맥주" maxlength="80"></label>' +
      '<div class="field"><span class="field-label">종류</span><div class="category-rail" id="category-rail">' + categoryChipsHtml(draft) + '</div></div>' +
      aiPanelHtml(draft) +
      '<label class="field"><span class="field-label">설명 <em>(사진이나 이름을 넣으면 AI가 자동으로 채워요)</em>' +
      '<span id="desc-loading-slot">' + (draft.aiLoading ? '<span class="desc-loading">' + ICONS.sparkle + ' 분석 중...</span>' : '') + '</span>' +
      '</span>' +
      '<textarea data-field="description" placeholder="종류, 도수, 원산지, 역사 등이 여기 자동으로 채워져요" maxlength="600" rows="4">' + escapeHtml(draft.description) + '</textarea></label>' +
      '<div class="field"><span class="field-label">평가 항목</span><div class="rating-panel">' + ratingRows + '</div>' +
      '<div class="overall-preview"><span>총 평점</span><strong>' + (overall !== null ? overall.toFixed(1) : '—') + '</strong><span class="of5">/ 5</span></div></div>' +
      '<label class="field"><span class="field-label">시음 메모 <em>(선택)</em></span>' +
      '<textarea data-field="memo" placeholder="맛, 향, 함께한 안주 등을 자유롭게" maxlength="500" rows="3">' + escapeHtml(draft.memo) + '</textarea></label>' +
      (state.formError ? '<p class="form-error">' + escapeHtml(state.formError) + '</p>' : '') +
      '<div class="form-actions"><button type="button" class="btn btn-ghost" data-action="cancel-form">취소</button>' +
      '<button type="submit" class="btn btn-primary" ' + (canSubmit ? '' : 'disabled') + '>' + (state.submitting ? '저장 중...' : (state.editingId ? '수정하기' : '기록하기')) + '</button></div>' +
      '</form>';
  }

  function setupViewHtml() {
    return '<div class="setup-screen">' +
      '<h2>닉네임을 정해주세요</h2>' +
      '<p class="setup-desc">이 링크를 여러 명이 같이 쓸 때, 각자 자기 기록만 보이게 구분하는 데 써요. 언제든 나중에 바꿀 수 있어요.</p>' +
      '<input type="text" data-field="setupName" value="' + escapeHtml(state.setupDraftName) + '" placeholder="예: 혜성" maxlength="20">' +
      (state.setupError ? '<p class="form-error">' + escapeHtml(state.setupError) + '</p>' : '') +
      '<div class="form-actions">' +
      (state.setupIsInitial ? '' : '<button type="button" class="btn btn-ghost" data-action="cancel-setup">취소</button>') +
      '<button type="button" class="btn btn-primary" data-action="confirm-setup">' + (state.setupIsInitial ? '시작하기' : '저장') + '</button>' +
      '</div></div>';
  }

  function confirmSetup() {
    var name = (state.setupDraftName || '').trim();
    if (!name) { state.setupError = '닉네임을 입력해주세요.'; render(); return; }
    state.myName = name;
    try { localStorage.setItem(STORAGE_KEY, name); } catch (e) {}
    state.setupError = null;
    setView('list');
  }

  function openChangeName() {
    state.setupDraftName = state.myName;
    state.setupIsInitial = false;
    state.setupError = null;
    setView('setup');
  }

  function detailViewHtml() {
    var d = state.drinks.filter(function (x) { return x.id === state.selectedId; })[0];
    if (!d) return '<div class="empty-state"><p>기록을 찾을 수 없어요.</p></div>';
    var cfg = CATEGORIES[d.category];
    var date = new Date(d.createdAt).toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
    var criteriaRows = cfg.criteria.map(function (c) {
      var v = d.ratings[c.key] || 0;
      return '<div class="criteria-row"><span>' + escapeHtml(c.label) + '</span><div class="criteria-value">' + scoreGauge(v, 'sm') + '<span class="score-num">' + v + '</span></div></div>';
    }).join('');
    var deleteBtn = state.deleteConfirmId === d.id
      ? '<button type="button" class="btn btn-danger" data-action="confirm-delete" data-id="' + d.id + '">정말 삭제할까요?</button>'
      : '<button type="button" class="btn btn-danger-outline" data-action="ask-delete" data-id="' + d.id + '">삭제</button>';
    var isMine = !d.owner || d.owner === state.myName;
    var ownerActions = isMine
      ? ('<button type="button" class="btn btn-secondary" data-action="edit-drink" data-id="' + d.id + '">수정</button>' + deleteBtn)
      : '';

    return '<div class="drink-detail">' +
      '<div class="detail-media">' +
      (d.photo ? '<img src="' + d.photo + '" alt="' + escapeHtml(d.name) + '">' : '<span class="detail-icon">' + cfg.icon + '</span>') +
      '<button type="button" class="favorite-chip large ' + (d.favorite ? 'active' : '') + '" data-action="toggle-favorite" data-id="' + d.id + '" data-current="' + (!!d.favorite) + '" aria-label="즐겨찾기">' + heartIcon(d.favorite) + '</button>' +
      '</div>' +
      '<div class="detail-body">' +
      '<span class="detail-cat">' + cfg.icon + escapeHtml(cfg.label) + '</span>' +
      (!isMine ? '<span class="detail-owner-badge">' + escapeHtml(d.owner) + '님의 기록</span>' : '') +
      '<h2 class="detail-name">' + escapeHtml(d.name) + '</h2>' +
      '<p class="detail-date">' + date + ' 기록</p>' +
      '<div class="overall-block"><span class="overall-num">' + d.overallScore.toFixed(1) + '</span>' + scoreGauge(d.overallScore, 'lg') + '</div>' +
      '<div class="criteria-panel">' + criteriaRows + '</div>' +
      (d.description ? '<div class="memo-block"><span class="field-label">설명</span><p>' + escapeHtml(d.description) + '</p></div>' : '') +
      (d.location ? (
        '<div class="location-block">' +
        '<span class="field-label">촬영 위치</span>' +
        '<p>' + formatCoord(d.location) + (d.takenAt ? ' · ' + formatTakenAt(d.takenAt) : '') + '</p>' +
        '<a class="location-link" href="' + mapsUrl(d.location) + '" target="_blank" rel="noopener">' + ICONS.pin + ' 구글맵에서 보기</a>' +
        '</div>'
      ) : '') +
      (d.memo ? '<div class="memo-block"><span class="field-label">시음 메모</span><p>' + escapeHtml(d.memo) + '</p></div>' : '') +
      '<div class="form-actions">' +
      '<button type="button" class="btn btn-ghost" data-action="back">목록으로</button>' +
      ownerActions +
      '</div></div></div>';
  }

  function render() {
    var app = document.getElementById('app');
    var mainHtml;
    if (state.dbReady === null) mainHtml = '<div class="status-screen"><p>불러오는 중...</p></div>';
    else if (state.dbReady === false) mainHtml = '<div class="status-screen"><p>저장 기능을 사용할 수 없어요.</p><p class="status-sub">페이지를 새로고침하거나, 전체 화면으로 열어 다시 시도해주세요.</p></div>';
    else if (state.view === 'setup') mainHtml = setupViewHtml();
    else if (state.view === 'list') mainHtml = listViewHtml();
    else if (state.view === 'form' || state.view === 'editForm') mainHtml = formViewHtml();
    else mainHtml = detailViewHtml();
    app.innerHTML = headerHtml() + '<main class="app-main">' + mainHtml + '</main>';
  }

  function setView(v) {
    state.deleteConfirmId = null;
    state.view = v;
    render();
    window.scrollTo(0, 0);
  }

  function goBack() {
    if (state.view === 'detail') setView('list');
    else if (state.view === 'editForm') { state.selectedId = state.editingId; setView('detail'); }
    else if (state.view === 'setup') setView('list');
    else setView('list');
  }

  function freshFormDraft() {
    return {
      photoFile: null, aiResult: null, aiLoading: false, aiError: null,
      aiSource: null, descriptionFromAi: false, lastAnalyzedName: null,
      candidates: [], infoForName: null, categoryPicked: false
    };
  }

  function openAddForm() {
    state.editingId = null;
    state.formDraft = Object.assign(
      { name: '', category: Object.keys(CATEGORIES)[0], ratings: {}, memo: '', description: '', photo: null, thumb: null, favorite: false, compressing: false, location: null, takenAt: null },
      freshFormDraft()
    );
    state.formError = null;
    setView('form');
  }

  function openEditForm(id) {
    var d = state.drinks.filter(function (x) { return x.id === id; })[0];
    if (!d) return;
    state.editingId = id;
    state.formDraft = Object.assign(
      { name: d.name, category: d.category, ratings: Object.assign({}, d.ratings), memo: d.memo || '', description: d.description || '', photo: d.photo || null, thumb: d.thumb || null, favorite: !!d.favorite, compressing: false, location: d.location || null, takenAt: d.takenAt || null },
      freshFormDraft(),
      { categoryPicked: true }
    );
    state.formError = null;
    setView('editForm');
  }

  function openDetail(id) { state.selectedId = id; setView('detail'); }

  async function submitForm() {
    var draft = state.formDraft;
    if (!draft.name.trim()) { state.formError = '술 이름을 입력해주세요.'; render(); return; }
    var cfg = CATEGORIES[draft.category];
    for (var i = 0; i < cfg.criteria.length; i++) {
      var c = cfg.criteria[i];
      if (!draft.ratings[c.key]) { state.formError = c.label + ' 항목에 점수를 매겨주세요.'; render(); return; }
    }
    state.submitting = true; state.formError = null; render();
    var overallScore = Math.round((cfg.criteria.reduce(function (s, c) { return s + draft.ratings[c.key]; }, 0) / cfg.criteria.length) * 10) / 10;
    var payload = {
      name: draft.name.trim(), category: draft.category, ratings: draft.ratings,
      memo: draft.memo || '', description: draft.description || '',
      photo: draft.photo || null, thumb: draft.thumb || null, overallScore: overallScore,
      location: draft.location || null, takenAt: draft.takenAt || null
    };
    try {
      if (state.editingId) {
        payload.favorite = draft.favorite;
        // owner 필드는 보내지 않아 병합 업데이트에서 원래 작성자가 그대로 유지된다
        await db.doc('drinks/' + state.editingId).update(payload);
        state.selectedId = state.editingId;
        setView('detail');
      } else {
        payload.favorite = false;
        payload.owner = state.myName;
        payload.createdAt = new Date().toISOString();
        await db.collection('drinks').add(payload);
        setView('list');
      }
    } catch (err) {
      state.formError = friendlyDbError(err);
    } finally {
      state.submitting = false; render();
    }
  }

  async function toggleFavorite(id, current) {
    try {
      await db.doc('drinks/' + id).update({ favorite: !current });
      var d = state.drinks.filter(function (x) { return x.id === id; })[0];
      if (d) d.favorite = !current;
      render();
    } catch (err) { alert(friendlyDbError(err)); }
  }

  async function deleteDrink(id) {
    try {
      await db.doc('drinks/' + id).delete();
      state.drinks = state.drinks.filter(function (d) { return d.id !== id; });
      setView('list');
    } catch (err) { alert(friendlyDbError(err)); }
  }

  async function handlePhotoSelected(file) {
    if (!file) return;
    state.formDraft.photoFile = file;
    state.formDraft.aiResult = null;
    state.formDraft.aiError = null;
    state.formDraft.location = null;
    state.formDraft.takenAt = null;
    state.formDraft.compressing = true; render();
    try {
      var result = await preparePhoto(file);
      state.formDraft.photo = result.photo;
      state.formDraft.thumb = result.thumb;
    } catch (err) {
      state.formError = '사진을 처리하지 못했어요.';
    } finally {
      state.formDraft.compressing = false; render();
    }
    try {
      var exif = await extractExif(file);
      state.formDraft.location = exif.location || null;
      state.formDraft.takenAt = exif.takenAt || null;
      render();
    } catch (e) { /* EXIF 정보 없이도 나머지 기능은 정상 동작해야 한다 */ }
    if (sampleReady) await sampleReady;
    if (!sample) return;
    if (state.sampleImagesAvailable) analyzePhoto();
    else syncAiUi();
  }

  function onRootClick(e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.dataset.action;
    if (action === 'open-add-form') openAddForm();
    else if (action === 'open-detail') openDetail(el.dataset.id);
    else if (action === 'back') goBack();
    else if (action === 'cancel-form') goBack();
    else if (action === 'toggle-favorite') toggleFavorite(el.dataset.id, el.dataset.current === 'true');
    else if (action === 'set-filter-category') { state.filterCategory = el.dataset.category; render(); }
    else if (action === 'pick-category') { state.formDraft.category = el.dataset.category; state.formDraft.categoryPicked = true; state.formDraft.ratings = {}; render(); }
    else if (action === 'set-rating') { state.formDraft.ratings[el.dataset.key] = Number(el.dataset.value); render(); }
    else if (action === 'trigger-library-input') document.getElementById('library-file-input').click();
    else if (action === 'trigger-camera-input') document.getElementById('camera-file-input').click();
    else if (action === 'remove-photo') {
      state.formDraft.photo = null; state.formDraft.thumb = null; state.formDraft.photoFile = null;
      state.formDraft.aiResult = null; state.formDraft.aiError = null;
      state.formDraft.location = null; state.formDraft.takenAt = null;
      state.formDraft.candidates = [];
      render();
    }
    else if (action === 'analyze-photo') analyzePhoto();
    else if (action === 'analyze-name') analyzeName();
    else if (action === 'apply-candidate') applyCandidate(el.dataset.name);
    else if (action === 'edit-drink') openEditForm(el.dataset.id);
    else if (action === 'ask-delete') { state.deleteConfirmId = el.dataset.id; render(); }
    else if (action === 'confirm-delete') deleteDrink(el.dataset.id);
    else if (action === 'change-name') openChangeName();
    else if (action === 'confirm-setup') confirmSetup();
    else if (action === 'cancel-setup') setView('list');
    else if (action === 'switch-tab') { state.mainTab = el.dataset.tab; render(); }
  }

  function onRootKeydown(e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var el = e.target.closest('[data-action]');
    if (!el || el.tagName === 'BUTTON' || el.tagName === 'INPUT') return;
    e.preventDefault(); el.click();
  }

  function onRootInput(e) {
    var field = e.target.dataset.field;
    if (!field) return;
    if (field === 'setupName') { state.setupDraftName = e.target.value; return; }
    if (!state.formDraft) return;
    if (field === 'name') { state.formDraft.name = e.target.value; scheduleNameAnalysis(); }
    if (field === 'memo') state.formDraft.memo = e.target.value;
    if (field === 'description') {
      state.formDraft.description = e.target.value;
      state.formDraft.descriptionFromAi = false;
    }
  }

  function onRootChange(e) {
    if (e.target.id === 'library-file-input' || e.target.id === 'camera-file-input') handlePhotoSelected(e.target.files[0]);
    if (e.target.id === 'favorites-toggle') { state.favoritesOnly = e.target.checked; render(); }
    if (e.target.id === 'show-all-toggle') { state.showAllOwners = e.target.checked; render(); }
  }

  function onRootSubmit(e) {
    if (e.target.id === 'drink-form') { e.preventDefault(); submitForm(); }
  }

  var appEl = document.getElementById('app');
  appEl.addEventListener('click', onRootClick);
  appEl.addEventListener('keydown', onRootKeydown);
  appEl.addEventListener('input', onRootInput);
  appEl.addEventListener('change', onRootChange);
  appEl.addEventListener('submit', onRootSubmit);

  sampleReady = (async function () {
    try { sample = await window.claude.use('sample'); } catch (e) { sample = null; }
    state.sampleTextAvailable = !!sample;
    if (sample) {
      try {
        var limits = await sample.limits();
        state.sampleImagesAvailable = !!(limits && limits.images);
      } catch (e) { state.sampleImagesAvailable = false; }
    }
    state.sampleChecked = true;
    if (state.view === 'form' || state.view === 'editForm') syncAiUi();
  })();

  (async function init() {
    var dbNs = null;
    try { dbNs = await window.claude.use('db'); } catch (e) { dbNs = null; }
    if (!dbNs) { state.dbReady = false; render(); return; }
    db = dbNs;
    state.dbReady = true;
    var storedName = null;
    try { storedName = localStorage.getItem(STORAGE_KEY); } catch (e) { storedName = null; }
    if (storedName && storedName.trim()) {
      state.myName = storedName.trim();
    } else {
      state.setupIsInitial = true;
      state.view = 'setup';
    }
    db.collection('drinks').orderBy('createdAt', 'desc').onSnapshot(
      function (snap) {
        state.drinks = snap.docs.map(function (doc) { return Object.assign({ id: doc.id }, doc.data()); });
        if (state.view === 'list') render();
      },
      function (err) { console.error('db snapshot error', err); }
    );
    render();
  })();
})();
</script>
